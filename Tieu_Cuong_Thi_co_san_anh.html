<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cương Thi - Tranh Vẽ</title>
    <style>
      
        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #0d0c11;
            background-image: radial-gradient(circle at top, #1f1b2e 0%, #09080c 100%);
            color: #e6d8b5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        
        .khung-tranh {
            position: relative;
            max-width: 450px;
            width: 100%;
            background: #17151c;
            border: 4px double #b8860b;
            box-shadow: 0 0 25px rgba(184, 134, 11, 0.25), inset 0 0 20px #000;
            padding: 25px;
            text-align: center;
            border-radius: 6px;
            box-sizing: border-box;
        }

   
        .la-bua {
            position: absolute;
            top: -15px;
            right: 25px;
            width: 46px;
            height: 130px;
            background: linear-gradient(to bottom, #f4c430, #daa520);
            border: 2px solid #8b0000;
            color: #b22222;
            font-weight: bold;
            font-size: 18px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 4px;
            box-shadow: 3px 5px 12px rgba(0,0,0,0.8);
            transform-origin: top center;
            animation: buaBay 3s ease-in-out infinite alternate;
            z-index: 10;
            user-select: none;
            transition: opacity 0.3s ease;
        }

        @keyframes buaBay {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(5deg); }
        }

        /* Tiêu đề trang
        h1 {
            color: #f4c430;
            text-shadow: 0 0 8px rgba(244, 196, 48, 0.5);
            letter-spacing: 3px;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .phu-de {
            color: #c0392b;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* Khung chứa bức ảnh vẽ */
        .hop-anh {
            position: relative;
            border: 3px solid #8b0000;
            padding: 8px;
            background: #23202b;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        .hop-anh img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.05);
            transition: transform 0.4s ease;
        }

        /* Hiệu ứng nhảy nhẹ kiểu cương thi khi rê/chạm vào ảnh */
        .hop-anh:hover img {
            animation: nhayCuongThi 0.5s ease;
        }

        @keyframes nhayCuongThi {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
            60% { transform: translateY(2px); }
        }

        /* Con dấu đỏ cổ điển */
        .con-dau {
            display: inline-block;
            margin-top: 18px;
            padding: 6px 14px;
            border: 2px solid #c0392b;
            color: #c0392b;
            font-weight: bold;
            font-size: 14px;
            transform: rotate(-3deg);
            letter-spacing: 2px;
            background: rgba(192, 57, 43, 0.08);
        }

        /* Mô tả thông tin nhân vật */
        .mo-ta {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            color: #cfc6b0;
            border-top: 1px dashed #554c38;
            padding-top: 12px;
        }

        /* Nhóm nút bấm */
        .nhom-nut {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .nut-bua {
            background-color: #8b0000;
            color: #f4c430;
            border: 1px solid #f4c430;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .nut-bua:hover {
            background-color: #b22222;
            box-shadow: 0 0 10px rgba(244, 196, 48, 0.6);
        }
    </style>
</head>

    <script>
        function goBua() {
            const bua = document.getElementById('buaChu');
            const trangThai = document.getElementById('trangThai');

            bua.style.opacity = '0.15';
